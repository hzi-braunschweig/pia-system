# NAKO Health Study customized messages
passwordResetSubject=Neues PIA-Passwort angefordert
passwordResetBody=Liebe:r PIA-Nutzer:in,\n\nes wurde vor Kurzem ein neues Passwort für Ihren PIA-Account angefordert, den Sie über die NAKO Gesundheitsstudie erhalten haben. Wenn Sie ein neues Passwort angefordert haben, klicken Sie bitte auf den unten stehenden Link.\n\n{0}\n\nDie Gültigkeit des Links wird in {1} Minuten verfallen.\n\nSollten Sie kein neues Passwort benötigen, können Sie diese Nachricht ignorieren und an Ihrem Account wird nichts geändert.\n\nWir danken Ihnen herzlich für die Nutzung von PIA im Rahmen der NAKO Gesundheitsstudie!\n\nIhr PIA-Team
passwordResetBodyHtml=Liebe:r PIA-Nutzer:in,<br><br>es wurde vor Kurzem ein neues Passwort für Ihren PIA-Account angefordert, den Sie über die NAKO Gesundheitsstudie erhalten haben. Wenn Sie ein neues Passwort angefordert haben, klicken Sie bitte auf den unten stehenden Link.<br><br><a href="{0}">Passwort zurücksetzen</a><br><br>Die Gültigkeit des Links wird in {1} Minuten verfallen.<br><br>Sollten Sie kein neues Passwort benötigen, können Sie diese Nachricht ignorieren und an Ihrem Account wird nichts geändert.<br><br>Wir danken Ihnen herzlich für die Nutzung von PIA im Rahmen der NAKO Gesundheitsstudie!<br><br>Ihr PIA-Team

emailVerificationSubject=E-Mail verifizieren  
emailVerificationBody=Jemand hat ein PIA-Konto mit dieser E-Mail-Adresse erstellt. Falls Sie das waren, dann klicken Sie auf den Link, um die E-Mail-Adresse zu verifizieren.\n\n{0}\n\nDieser Link wird in {1} Minuten ablaufen.\n\nFalls Sie dieses Konto nicht erstellt haben, dann können Sie diese Nachricht ignorieren.
emailVerificationBodyHtml=<p>Jemand hat ein PIA-Konto mit dieser E-Mail-Adresse erstellt. Falls Sie das waren, klicken Sie auf den Link, um die E-Mail-Adresse zu verifizieren.</p><p><a href="{0}">Link zur Bestätigung der E-Mail-Adresse</a></p><p>Dieser Link wird in {1} Minuten ablaufen.</p><p>Falls Sie dieses Konto nicht erstellt haben, dann können Sie diese Nachricht ignorieren.</p>