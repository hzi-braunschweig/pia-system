include:
  - local: ci/rules.yml
  - local: ci/k8s.yml

check-sonarqube:
  extends:
    - .job-exclude-schedules-pipelines
    - .no-cpu-request
  stage: push
  image:
    name: sonarsource/sonar-scanner-cli:11.4@sha256:14f46a51cbfde162e30cfd673bff542eca59860a0e904bcd2614f192605bd704
    entrypoint: ['']
  needs:
    - job: accumulate-coverage
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Defines the location of the analysis task cache
    GIT_DEPTH: '0' # Tells git to fetch all the branches of the project, required by the analysis task

    KUBERNETES_MEMORY_REQUEST: 4Gi
    KUBERNETES_MEMORY_LIMIT: 4Gi
  cache:
    key: '${CI_JOB_NAME}'
    paths:
      - .sonar/cache
  script:
    - git fetch --unshallow || true
    - for TSCONFIG in `ls */tsconfig.json`; do sed --in-place "s/@pia\/lib-service-core/..\/psa.lib.service-core\/tsconfig.global.json/g" $TSCONFIG; done
    - sonar-scanner -Dsonar.qualitygate.wait=true
  rules:
    - if: $SONAR_TOKEN == null
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH =~ /^develop/
    - if: $CI_COMMIT_TAG
