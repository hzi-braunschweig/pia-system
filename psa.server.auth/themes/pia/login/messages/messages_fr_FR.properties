piaPasswordMigrationMessage=Chers participants,<br/><br/>en raison d'une modification du système, il n'est désormais plus possible de désélectionner le mot de passe.<br/><br/><strong>Si vous n'utilisez pas actuellement de mot de passe, veuillez saisir votre nom d'utilisateur (pseudonyme) comme mot de passe.</strong> Si votre nom d'utilisateur est par exemple « PIA-1234567890 », saisissez une seule fois « pia-1234567890 » (en minuscules) comme mot de passe. \n Après vous être connecté, vous définissez ensuite un nouveau mot de passe que vous avez choisi vous-même.<br/><br/>Si vous cochez la case « Rester connecté », vous n'aurez plus besoin de vous reconnecter pendant une période prolongée.<br/><br/>Pour toute question à ce sujet, n'hésitez pas à contacter <a href\="mailto\:piapost@helmholtz-hzi.de">piapost@helmholtz-hzi.de</a>.
