include:
  - local: ci/rules.yml
  - local: ci/k8s.yml

npm-audit:
  extends:
    - .job-exclude-schedules-pipelines
    - .no-cpu-request
  stage: prepare
  image: node:20.3.0-buster-slim@sha256:9f4d4a6ebe2aa2068f53347e17e37995f0b2b5f372094354d6f8a155fdd3a5e6
  script:
    - npm install -g better-npm-audit
    - >
      for JOB in $JOBS_INSTALL; do
        cd $JOB
        echo Audit $JOB
        echo -------------------
        script -qefc "better-npm-audit audit --production --level=critical"
        echo -------------------
        cd ..
      done
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^release\/\d+\.\d+\.[1-9]\d*$/ && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME !~ /^release\/\d+\.\d+\.[1-9]\d*$/
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^\d+\.\d+\.[1-9]\d*$/
    - if: $CI_COMMIT_BRANCH =~ /^develop/
    - if: $CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+\.0$/
