@if (platform.is('hybrid')) {
<ion-item
  [id]="'open-datetime-' + consentName"
  lines="full"
  fill="filled"
  mode="md"
  class="ion-margin-start ion-margin-end"
>
  <ion-input
    *ngIf="displayValue"
    [value]="displayValue"
    [disabled]="formControl.disabled"
    [readonly]="!formControl.disabled"
    data-unit="display-value"
    [label]="label"
    labelPlacement="stacked"
  ></ion-input>
  <ion-input
    *ngIf="!displayValue"
    [value]="'GENERAL.PLEASE_CLICK' | translate"
    readonly
    [label]="label"
    labelPlacement="stacked"
  ></ion-input>

  <ion-modal [trigger]="'open-datetime-' + consentName" *ngIf="!form.disabled">
    <ng-template>
      <ion-content>
        <ion-datetime
          [id]="'datetime-' + consentName"
          size="cover"
          presentation="date"
          preferWheel="true"
          firstDayOfWeek="1"
          showDefaultTitle="true"
          [formControl]="formControl"
          [cancelText]="'GENERAL.CANCEL_TEXT' | translate"
          [doneText]="'GENERAL.DONE_TEXT' | translate"
          [showDefaultButtons]="true"
        >
          <div slot="title">
            {{ 'GENERAL.SELECT_DATE' | translate }}
          </div>
        </ion-datetime>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-item>
} @else {
<ion-item
  lines="full"
  fill="filled"
  mode="md"
  class="ion-margin-start ion-margin-end"
>
  <input
    type="date"
    [value]="dateInputValue"
    (change)="onDateInputChange($event)"
    [disabled]="formControl.disabled"
    style="
      width: 100%;
      padding: 12px 16px;
      border: none;
      background: transparent;
      font-size: 16px;
      color: #000000;
      color-scheme: light;
    "
  />
</ion-item>
}
