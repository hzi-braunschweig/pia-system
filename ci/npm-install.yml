include:
  - local: ci/rules.yml
  - local: ci/k8s.yml

npm-install:
  stage: prepare
  image: docker:28.4.0@sha256:831644212c5bdd0b3362b5855c87b980ea39a83c9e9adcef2ce03eced99a737a
  variables:
    DOCKER_HOST: null
  before_script:
    - docker buildx create --name buildkitd --driver remote $BUILDKITD_ADDRESS
    - docker buildx use buildkitd
    - docker buildx install
  extends:
    - .job-exclude-schedules-pipelines
    - .no-cpu-request
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - export TAG=$IMAGE_ID
    - export IMAGE_REGISTRY=$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    - docker buildx bake --push -f npm-install.hcl
  tags:
    - docker
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^develop/
    - if: $CI_COMMIT_BRANCH =~ /^release/
