apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo
metadata:
  name: local-k3s

namespace: pia

resources:
  - ../../base
  - internal-secrets.yaml

components:
  - ../../components/local-development
  - ../../components/custom-registry

secretGenerator:
  - name: docker-registry
    type: kubernetes.io/dockerconfigjson
    options:
      disableNameSuffixHash: true
    files:
      - .dockerconfigjson

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: "/spec/replicas"
        value: 1
