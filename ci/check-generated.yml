include:
  - local: ci/k8s.yml
  - local: ci/rules.yml

check-generated:
  extends:
    - .job-exclude-schedules-pipelines
    - .no-cpu-request
  stage: test
  image: $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/psa.utils.repo-tool:$IMAGE_ID
  needs:
    - job: build-docker
      artifacts: false
  variables:
    GIT_DEPTH: '1'
    BAKE_TARGET_FILE: 'new-bake.hcl'
    NPM_INSTALL_BAKE_TARGET_FILE: 'new-npm-install.hcl'
    GITLABCI_TARGET_FILE: 'new-gitlab-ci-generated.yml'
    SKAFFOLD_TARGET_FILE: 'new-skaffold.yaml'
  script:
    - node /usr/src/node-app/dist/index.js generate
    - diff bake.hcl $BAKE_TARGET_FILE
    - diff npm-install.hcl $NPM_INSTALL_BAKE_TARGET_FILE
    - diff skaffold.yaml $SKAFFOLD_TARGET_FILE
    - diff ./ci/generated.yml $GITLABCI_TARGET_FILE
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^develop/
    - if: $CI_COMMIT_BRANCH =~ /^release/
