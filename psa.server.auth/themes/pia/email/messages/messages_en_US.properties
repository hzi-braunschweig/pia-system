passwordResetSubject=PIA (incl. symptom diary) - A new password has been requested
passwordResetBody=Dear PIA user,\n\na new password has recently been requested for your PIA account. If you have requested this, please click on the link below.\n\n{0}\n\nThe validity of the link will expire in {1} minutes.\n\nIf you don''t need a new password, you can ignore this message and nothing will be changed in your account.\n\nThank you very much for using PIA.\n\nYour PIA team
passwordResetBodyHtml=Dear PIA user,<br><br>A new password has recently been requested for your PIA account. If you have requested this, please click on the link below.<br><br><a href\="{0}">Reset password</a><br><br>The validity of the link will expire in {1} minutes.<br><br>If you don''t need a new password, you can ignore this message and nothing will be changed in your account.<br><br>Thank you very much for using PIA.<br><br>Your PIA team

emailVerificationSubject=Verify email
emailVerificationBody=Someone has created an account using this email address. If this was you, please click on the link to verify your email address. \n\n{0}\n\nThe link will expire in {1} minutes.\n\nIf you have not created this account, you can ignore this message.
emailVerificationBodyHtml=<p>Someone has created an account using this e-mail address. If that was you, click on the link to verify the email address.</p><p><a href\="{0}">Link to confirm the email address</a></p><p>The link will expire in {1} minutes.</p><p>If you have not created this account, you can ignore this message.</p>
identityProviderLinkSubject=Link {0}
identityProviderLinkBody=A request has been made to link your account {1} with the account {0} of user {2}. If you have requested this, click on the link below.\n\n{3}\n\n The validity of the link will expire in {4} minutes.\n\nIf you do not wish to link your account, please ignore this message. If you link the accounts, a login to {1} via {0} will be enabled.
identityProviderLinkBodyHtml=<p>A request has been made to link your account {1} with the account {0} of user {2}. If you have requested this, click on the link below.</p><p><a href\="{3}">Link to confirm the account connection</a></p><p>The validity of the link will expire in {4} minutes.</p><p>If you do not wish to link your account, please ignore this message. If you link the accounts, a login to {1} via {0} will be enabled.</p>
executeActionsSubject=Update your account
executeActionsBody=Your administrator has asked you to update your account {2}. Click on the link below to start the process.\n\n{0}\n\nThe validity of the link will expire in {1} minutes.\n\nIf you are not aware of this request, ignore this message and your account will remain unchanged.
executeActionsBodyHtml=<p>Your administrator has asked you to update your account {2}. Click on the link below to start the process.</p><p><a href\="{0}">Link to account update</a></p><p>The validity of the link will expire in {1} minutes.</p><p>If you are not aware of this request, ignore this message and your account will remain unchanged.</p>
eventLoginErrorSubject=Failed login
eventLoginErrorBody=Someone tried to log in to your account at {0} from {1}. If this was not you, please contact your admin.
eventLoginErrorBodyHtml=<p>Someone tried to log in to your account at {0} from {1}. If this was not you, please contact your admin.</p>
eventRemoveTotpSubject=OTP removed
eventRemoveTotpBody=OTP was removed from your account on {0} by {1}. If this was not you, please contact your admin.
eventRemoveTotpBodyHtml=<p>OTP was removed from your account on {0} by {1}. If this was not you, please contact your admin.</p>
eventUpdatePasswordSubject=Password updated
eventUpdatePasswordBody=Your password was changed on {0} by {1}. If this was not you, please contact your admin.
eventUpdatePasswordBodyHtml=<p>Your password was changed on {0} by {1}. If this was not you, please contact your admin.</p>
eventUpdateTotpSubject=OTP updated
eventUpdateTotpBody=OTP was changed on {0} by {1}. If this was not you, please contact your admin.
eventUpdateTotpBodyHtml=<p>OTP was changed on {0} by {1}. If this was not you, please contact your admin.</p>

