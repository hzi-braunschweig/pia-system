apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: pia-nako-theme
    options:
      disableNameSuffixHash: true
    files:
      # Theme configuration
      - theme.properties
      # Message files
      - messages_de_DE.properties
      - messages_de_CH.properties

patches:
  # Mount the pia-nako theme directly into Keycloak themes directory
  - target:
      kind: Deployment
      name: authserver
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authserver
      spec:
        template:
          spec:
            containers:
            - name: main
              volumeMounts:
              # Mount theme.properties to email theme directory
              - name: pia-nako-theme
                mountPath: /opt/keycloak/themes/pia-nako/email/theme.properties
                subPath: theme.properties
                readOnly: true
              # Mount messages directory
              - name: pia-nako-theme
                mountPath: /opt/keycloak/themes/pia-nako/email/messages
                readOnly: true
              env:
              - name: EMAIL_THEME
                value: "pia-nako"
            volumes:
            - name: pia-nako-theme
              configMap:
                name: pia-nako-theme
