passwordResetSubject=PIA (y compris le journal des symptômes) - Un nouveau mot de passe a été demandé
passwordResetBody=Cher utilisateur de PIA,\n\nun nouveau mot de passe a été récemment demandé pour votre compte PIA. Si vous l''avez demandé, veuillez cliquer sur le lien ci-dessous.\n\n{0}\n\nLa validité du lien expirera dans {1} minutes.\n\nSi vous n''avez pas besoin d''un nouveau mot de passe, vous pouvez ignorer ce message et votre compte ne sera pas modifié.\n\nNous vous remercions cordialement de l''utilisation de PIA.\n\nVotre équipe PIA
passwordResetBodyHtml=Cher utilisateur PIA,<br><br>un nouveau mot de passe a récemment été demandé pour votre compte PIA. Si vous l''avez demandé, veuillez cliquer sur le lien ci-dessous..<br><br><a href\="{0}">Réinitialiser le mot de passe</a><br><br>La validité du lien expirera dans {1} minutes.<br><br>Si vous n''avez pas besoin d''un nouveau mot de passe, vous pouvez ignorer ce message et votre compte ne sera pas modifié.<br><br>Nous vous remercions vivement d''utiliser PIA.<br><br>Votre équipe PIA

emailVerificationSubject=Vérifier l'e-mail
emailVerificationBody=Quelqu''un a créé un compte PIA avec cette adresse e-mail. Si c''était vous, cliquez sur le lien pour vérifier l''adresse e-mail.\n\n{0}\n\nCe lien expirera dans {1} minutes.\n\nSi vous n''avez pas créé ce compte, vous pouvez ignorer ce message.
emailVerificationBodyHtml=<p>Quelqu''un a créé un compte PIA avec cette adresse e-mail. Si c''était vous, cliquez sur le lien pour vérifier l''adresse e-mail.</p><p><a href\="{0}">Lien pour confirmer l''adresse e-mail</a></p><p>Ce lien expirera dans {1} minutes.</p><p>Si vous n''avez pas créé ce compte, vous pouvez ignorer ce message.</p>
identityProviderLinkSubject=Lien {0}
identityProviderLinkBody=Il a été demandé de lier votre compte {1} avec le compte {0} de l''utilisateur {2}. Si vous avez fait cette demande, cliquez sur le lien ci-dessous.\n\n{3}\n\n La validité du lien expirera dans {4} minutes.\n\nSi vous ne souhaitez pas lier votre compte, veuillez ignorer ce message. Si vous liez les comptes, un login sur {1} sera possible via {0}.
identityProviderLinkBodyHtml=<p>Il a été demandé de lier votre compte {1} avec le compte {0} de l''utilisateur {2}. Si vous avez fait cette demande, cliquez sur le lien ci-dessous.</p><p><a href\="{3}">Lien de confirmation de l''association du compte</a></p><p>La validité du lien expirera dans {4} minutes.</p><p>Si vous ne souhaitez pas lier votre compte, ignorez ce message. Si vous liez les comptes, vous pourrez vous connecter sur {1} via {0}.</p>
executeActionsSubject=Mettre à jour son compte
executeActionsBody=Votre administrateur vous a demandé de mettre à jour votre compte {2}. Cliquez sur le lien ci-dessous pour démarrer le procès.\n\n{0}\n\nLa validité du lien expirera dans {1} minutes.\n\nSi vous n''êtes pas au courant de cette demande, ignorez ce message et votre compte restera inchangé.
executeActionsBodyHtml=<p>Votre administrateur vous a demandé de mettre à jour votre compte {2}. Cliquez sur le lien ci-dessous pour lancer le procès.</p><p><a href\="{0}">Lien vers la mise à jour du compte</a></p><p>La validité du lien expirera dans {1} minutes.</p><p>Si vous n''êtes pas au courant de cette demande, ignorez ce message et votre compte restera inchangé.</p>
eventLoginErrorSubject=Échec de l'inscription
eventLoginErrorBody=Quelqu''un a essayé de se connecter à votre compte à {0} de {1}. Si ce n''était pas vous, veuillez contacter votre admin.
