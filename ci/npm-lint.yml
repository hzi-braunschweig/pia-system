include:
  - local: ci/rules.yml
  - local: ci/k8s.yml

lint:
  extends:
    - .job-exclude-schedules-pipelines
    - .no-cpu-request
  stage: test
  image: $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/$FOLDER-npm-install:$IMAGE_ID
  variables:
    KUBERNETES_MEMORY_REQUEST: 2Gi # web app needs more memory
    KUBERNETES_MEMORY_LIMIT: 2Gi
  script:
    - ln -s $NODE_PATH $FOLDER/node_modules
    - cd $FOLDER
    - npm run lint
  needs:
    - job: npm-install
      artifacts: false
  parallel:
    matrix:
      - FOLDER: !reference [.modules, array, lint]
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^develop/
    - if: $CI_COMMIT_BRANCH =~ /^release/
